[project]
name = "minicode-agent"
version = "0.1.0"
description = "A local-first, auditable, and reproducible coding agent runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.3.1,<4",
    "pydantic>=2.12,<3",
]

[project.scripts]
minicode = "minicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src",
    "typechecks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
