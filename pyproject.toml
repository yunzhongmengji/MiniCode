[project]
name = "minicode-agent"
version = "0.1.0"
description = "A local-first, auditable, and reproducible coding agent runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
minicode = "minicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
